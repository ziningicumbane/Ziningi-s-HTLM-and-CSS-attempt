<p>Up next is the Order Button</p>
<P></P>

<button class="order-now-button">Order Now</button>
<style>.order-now-button {color: white;
background-color: black;
border-radius: 20px;
border-color: rgb(222, 8, 8);
border-width: 40px;
border: 22px;
height: 42px;
width: 115px;
cursor: pointer;  
transition: opacity 1.5s;
} 
.order-now-button:hover{
opacity: 0.8;
}
.order-now-button:active{
    opacity: 0.5;
}
</style>
<P>Lastly, A CANCEL ORDER button</P>
<p></p>
<button class="cancel-order-button">Cancel Order</button>
<style>.cancel-order-button {
    background-color: rgb(145, 31, 31);

    width: 125px;
    height: 47px;
    transition: opacity 1.5s;
    transition:background-color 1.5s;
} .cancel-order-button:active{
